<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta – Preguntas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="encabezado">
  <h1>UNIVERSIDAD TECNOLÓGICA DEL NORTE DE GUANAJUATO</h1>
  <nav>
    <a class="activo" href="index.html">1. Preguntas</a>
    <a class="boton" href="admin.html" id="btnAdmin">Administrador</a>
    <span id="fecha"></span>
  </nav>
</header>

<main>
  <form id="formEncuesta" novalidate>
    <section class="tarjeta">
      <h2>Datos generales</h2>
      <div class="fila">
        <div class="campo">
          <label for="grupo">Grupo</label>
          <input id="grupo" name="grupo" type="text" required minlength="7" maxlength="7" pattern="[A-Za-z]{4}[0-9]{3}" title="4 letras y 3 dígitos (ej. GTID244)" placeholder="GTID244" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <small class="error" id="e-grupo"></small>
        </div>
        <div class="campo">
          <label for="profesor">Profesor</label>
          <select id="profesor" name="profesor" required>
            <option value="">Cargando profesores…</option>
          </select>
          <small class="error" id="e-profesor" role="alert"></small>
        </div>
        <div class="campo">
          <label for="materia">Materia</label>
          <select id="materia" name="materia" required disabled>
            <option value="">Primero selecciona un profesor</option>
          </select>
          <small class="info" id="i-materia"></small>
          <small class="error" id="e-materia" role="alert"></small>
        </div>
      </div>
    </section>

    <section class="tarjeta"> 
      <h2>Encuesta del alumno</h2>
      <p class="ayuda">Califica cada afirmación de <b>5</b> (más bajo) a <b>10</b> (más alto).</p>
      <div class="encab-preg"><span>No.</span><span>Pregunta</span><span>Calificación</span></div>
      <div id="preguntas"></div>
      <small class="error" id="e-preguntas" role="alert"></small>

      <div class="campo">
        <label for="comentario">Comentarios (opcional)</label>
        <textarea id="comentario" maxlength="200" rows="2"></textarea>
        <small id="contador">0 / 200</small>
        <small class="error" id="e-comentario" role="alert"></small>
      </div>
      <div class="botones">
        <button type="submit" id="btnGuardar">Guardar encuesta</button>
        <button type="button" id="btnLimpiar" class="secundario">Limpiar</button>
        <span id="aviso" class="aviso" role="status" hidden>✔ Encuesta guardada. ¡Gracias por tu opinión!</span>
      </div>
      <small class="error" id="e-envio" role="alert"></small>
    </section>
  </form>
</main>
<script src="js/config.js"></script>
<script src="js/datos.js"></script>
<script src="js/captura.js"></script>
</body>
</html>
